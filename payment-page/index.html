<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick UPI Payment</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 32px 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
    }
    h2 {
      text-align: center;
      color: #111827;
      margin-bottom: 6px;
      font-size: 22px;
    }
    p.subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #2563eb;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 6px;
    }
    button:hover {
      background: #1d4ed8;
    }
    button:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }
    .error-msg {
      color: #dc2626;
      background: #fef2f2;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 14px;
      display: none;
      text-align: center;
    }
    .secure-badge {
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
      margin-top: 18px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Instant Payment</h2>
    <p class="subtitle">Pay securely via UPI / QR Code</p>

    <form id="payForm">
      <div class="form-group">
        <label for="phone">Mobile Number</label>
        <input 
          type="tel" 
          id="phone" 
          placeholder="Enter 10-digit mobile number" 
          maxlength="10" 
          pattern="[0-9]{10}" 
          required 
        />
      </div>

      <div class="form-group">
        <label for="amount">Amount (₹)</label>
        <input 
          type="number" 
          id="amount" 
          placeholder="Enter amount (e.g. 500)" 
          min="1" 
          step="any" 
          required 
        />
      </div>

      <button type="submit" id="payBtn">Pay Now</button>
      <div class="error-msg" id="errorBox"></div>
    </form>

    <div class="secure-badge">🔒 100% Safe & Encrypted Payment</div>
  </div>

  <script>
    const form = document.getElementById("payForm");
    const payBtn = document.getElementById("payBtn");
    const errorBox = document.getElementById("errorBox");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.style.display = "none";

      const phone = document.getElementById("phone").value.trim();
      const amount = document.getElementById("amount").value.trim();

      if (phone.length !== 10 || isNaN(phone)) {
        showError("Kripya sahi 10-digit mobile number daalein.");
        return;
      }

      if (!amount || Number(amount) <= 0) {
        showError("Kripya sahi amount daalein.");
        return;
      }

      // Button loading state
      payBtn.disabled = true;
      payBtn.textContent = "Generating QR...";

      try {
        const res = await fetch("/api/create-order", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone, amount })
        });

        const data = await res.json();

        if (res.ok && data.checkout_url) {
          // Gateway ke QR/UPI checkout page par bhejein
          window.location.href = data.checkout_url;
        } else {
          showError(data.error || "QR generate nahi ho paya. Dobara try karein.");
          resetBtn();
        }
      } catch (err) {
        showError("Network error! Internet check karein.");
        resetBtn();
      }
    });

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = "block";
    }

    function resetBtn() {
      payBtn.disabled = false;
      payBtn.textContent = "Pay Now";
    }
  </script>

</body>
</html>
